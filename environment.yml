# Shared compatibility environment, not the recovered paper environment.
# Create: PIP_NO_BUILD_ISOLATION=0 conda env create -f environment.yml
# The pip flag lets legacy evaluation packages use the build dependencies below.
name: da-spl-repro
channels:
  - conda-forge
dependencies:
  - python=3.9.23
  - pip=24.3.1
  - setuptools=69.5.1
  - wheel=0.45.1
  - numpy=1.23.5
  - scipy=1.10.1
  - cython=0.29.37
  - pip:
      - torch==2.0.1
      - torchvision==0.15.2
      - timm==0.6.13
      - torchmetrics==0.11.4
      - Pillow==9.5.0
      - h5py==3.10.0
      - tqdm==4.66.5
      - opencv-python-headless==4.8.1.78
      - scikit-learn==1.3.2
      - nltk==3.8.1
      - huggingface-hub==0.24.7
      - pyarrow==14.0.2
      - pandas==2.0.3
      - PyYAML==6.0.2
      - gensim==3.8.3
      - Theano==1.0.5
      - nlg-eval @ git+https://github.com/Maluuba/nlg-eval.git@2ab4528fad5548315cf61e40c2249fec8c8ad233
